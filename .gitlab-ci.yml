stages: [verify, freshness]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

default:
  image: python:3.12-slim
  interruptible: true

verify:
  stage: verify
  timeout: 5m
  script:
    - python -m unittest discover -s tests -v
    - python scripts/validate.py
    - python scripts/package.py --output dist
    - python scripts/prepare_marketplace.py
    - python scripts/validate.py --marketplace
  artifacts:
    paths: [dist/]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

mcp:
  stage: verify
  image: node:22-bookworm-slim
  timeout: 5m
  script:
    - cd mcp
    - npm ci --no-audit --no-fund
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

freshness:
  stage: freshness
  timeout: 5m
  script:
    - python scripts/freshness.py --output reports --write-baseline
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true
